<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Easy D Logistics</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- SEO Description -->
    <meta
      name="description"
      content="Easy D Logistics offers professional dispatching services for owner-operators and small fleets. Maximize earnings, reduce stress, and stay on the road."
    />
  </head>

  <body style="background-color: var(--color-primary); color: var(--color-text-primary);">
    <div id="root"></div>

    <!-- ✅ Netlify Forms SPA fallback (hidden, for build-time detection only) -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <textarea name="message"></textarea>
      <input name="company" type="text" />
    </form>

    <form name="get-started" method="POST" data-netlify="true" data-netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="get-started" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="mcNumber" type="text" />
      <input name="truckType" type="text" />
      <input name="equipment" type="text" />
      <input name="regions" type="text" />
      <input name="revenueGoal" type="text" />
      <input name="company" type="text" />
    </form>
    <!-- ✅ end fallback -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
